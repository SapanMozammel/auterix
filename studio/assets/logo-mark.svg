<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Auterix">
  <defs>
    <!-- Ultra-Rich High-Contrast Tech Gradient: Electric Sky to Royal Sapphire to Deep Indigo -->
    <linearGradient id="auterixMarkBg" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="40%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#3a1c71"/>
    </linearGradient>
    <!-- Luminous Chamber Infill (Fills internal gap hole with frosted glass) -->
    <linearGradient id="auterixChamberFill" x1="96" y1="39" x2="96" y2="147" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.45)"/>
      <stop offset="60%" stop-color="rgba(37, 99, 235, 0.55)"/>
      <stop offset="100%" stop-color="rgba(58, 28, 113, 0.7)"/>
    </linearGradient>
    <!-- Inner Autonomous Agent Chevron Fill: Clean Luminous Ice Tone -->
    <linearGradient id="auterixChevronFill" x1="96" y1="66" x2="96" y2="121" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Rich Depth -->
  <rect width="192" height="192" rx="48" fill="url(#auterixMarkBg)"/>
  
  <!-- Specular Glass Rim Highlight -->
  <rect x="2" y="2" width="188" height="188" rx="46" stroke="rgba(255, 255, 255, 0.35)" stroke-width="4" fill="none"/>

  <!-- 1. Filled Triangle Chamber (Eliminates all hollow gap holes) -->
  <polygon points="96,39 147,147 45,147" fill="url(#auterixChamberFill)"/>

  <!-- 2. Solid Filled Inner Chevron (Autonomous Forward Vector Core) -->
  <polygon points="96,66 122,121 96,103 70,121" fill="url(#auterixChevronFill)"/>

  <!-- 3. Architectural Vector Framework (Pure White, Razor-Sharp) -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer Containment Delta Frame (Apex to feet) -->
    <path d="M45 147L96 39L147 147" stroke="#ffffff" stroke-width="12.6"/>
    <!-- Inner Chevron Perimeter -->
    <path d="M70 121L96 66L122 121" stroke="#ffffff" stroke-width="10.8"/>
    <!-- Unified Solid White Architectural Crossbar -->
    <path d="M68 99H124" stroke="#ffffff" stroke-width="12.6"/>
  </g>
</svg>
