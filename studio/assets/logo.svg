      <path d="M 12 13.8 H 17.2" stroke="#38bdf8" stroke-width="2.1" stroke-dasharray="2.2 1.6"/>
    </g>
  </g>

  <!-- Typography Lockup -->
  <!-- Wordmark "AUTERIX" -->
  <text x="54" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" letter-spacing="-0.025em">AUTERIX</text>
  
  <!-- Micro-Pill "STANDARD" -->
  <rect x="144" y="14" width="68" height="17" rx="8.5" fill="rgba(2, 132, 199, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
  <text x="178" y="26.5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.04em" text-anchor="middle">STANDARD</text>

