  <text x="54" y="41" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" letter-spacing="-0.01em">Deterministic AI Context Engine</text>
