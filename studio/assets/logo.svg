<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none" role="img" aria-label="Auterix">
  <defs>
    <linearGradient id="logoBg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Mark Container (36x36 at x=6, y=6) -->
  <g transform="translate(6, 6)">
    <rect width="36" height="36" rx="8.5" fill="url(#logoBg)"/>
    <rect x="0.75" y="0.75" width="34.5" height="34.5" rx="7.75" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none"/>
    <g transform="translate(6, 6) scale(1)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 4.2 19.8 L 12 3.8 L 19.8 19.8" stroke="#ffffff" stroke-width="2.1"/>
      <path d="M 8.2 16.5 L 12 9.5 L 15.8 16.5" stroke="#ffffff" stroke-width="1.8"/>
