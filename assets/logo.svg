<svg xmlns="http://www.w3.org/2000/svg" width="320" height="72" viewBox="0 0 320 72" fill="none" role="img" aria-label="Auterix">
  <style>
    .mark-blade { stroke: #38bdf8; }
    .wordmark { fill: #ffffff; }
    .badge-rect { fill: rgba(2, 132, 199, 0.12); stroke: rgba(56, 189, 248, 0.35); }
    .badge-text { fill: #38bdf8; }
    .subline { fill: #64748b; }
  </style>
  <!-- Scaled Mark (1.6667x at x=16, y=16) -->
  <g transform="translate(16, 16) scale(1.6667)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path class="mark-blade" d="M 12 2.5 L 4 21" stroke-width="2.1" stroke-linecap="round"/>
    <path class="mark-blade" d="M 12 2.5 L 20 21" stroke-width="2.1" stroke-linecap="round"/>
    <path class="mark-blade" d="M 7.2 13.8 H 12" stroke-width="2.1" stroke-linecap="round"/>
    <path class="mark-blade" d="M 12 13.8 H 16.8" stroke-width="2.1" stroke-linecap="round" stroke-dasharray="2.6 2.1"/>
    <path class="mark-blade" d="M 4 21 L 10.8 9.5" stroke-width="1.8" stroke-linecap="round"/>
    <path class="mark-blade" d="M 20 21 L 13.2 9.5" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text class="wordmark" x="72" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="26" font-weight="600" letter-spacing="-0.02em">Auterix</text>

  <!-- Micro-Pill Tag -->
  <rect class="badge-rect" x="180" y="21" width="76" height="20" rx="10" stroke-width="1"/>
  <text class="badge-text" x="218" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="0.04em" text-anchor="middle">STANDARD</text>

  <!-- Subline Tagline -->
  <text class="subline" x="72" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="-0.01em">Deterministic AI Context Engine</text>
</svg>
